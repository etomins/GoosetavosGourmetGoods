<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goosetavo's Gourmet Goods — Can Your Business Survive?</title>
<style>
:root{
  --ink:#18304a; --paper:#fffaf0; --sky:#dff1f7; --yellow:#f7cf4b;
  --blue:#dfeefa; --green:#e7f5df; --pink:#f8e1e6; --lav:#eee5f7;
}
*{box-sizing:border-box}
body{margin:0;background:#eaf5f7;color:var(--ink);font-family:Arial,Helvetica,sans-serif}
button,textarea{font:inherit}
.game{max-width:1180px;margin:24px auto;background:var(--paper);border:3px solid var(--ink);border-radius:26px;overflow:hidden;box-shadow:0 8px 0 rgba(24,48,74,.12)}
header{background:var(--sky);padding:26px 30px 22px;border-bottom:3px solid var(--ink)}
.header-row{display:flex;align-items:center;gap:24px}
.goose{width:82px;min-width:82px}
.goose svg{width:82px;height:100px}
h1{font-size:clamp(34px,5vw,58px);line-height:.98;margin:0;font-weight:950;letter-spacing:-1.5px}
.subtitle{display:inline-block;margin-top:12px;background:var(--yellow);border:3px solid var(--ink);border-radius:999px;padding:8px 18px;font-weight:950;font-size:16px}
.speech{margin-left:auto;max-width:220px;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:14px 16px;font-weight:900;text-align:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:16px 22px;background:#fff;border-bottom:2px solid #d8dfe4}
.stat{border:2px solid var(--ink);border-radius:16px;padding:12px 16px}
.stat:nth-child(1){background:#f4f6d8}.stat:nth-child(2){background:var(--green)}.stat:nth-child(3){background:var(--blue)}
.stat-label{font-size:13px;text-transform:uppercase;font-weight:950}.stat-value{font-size:30px;font-weight:950;margin-top:3px}
.layout{display:grid;grid-template-columns:165px 1fr;gap:20px;padding:20px}
.progress{background:#e9f1f5;border:2px solid var(--ink);border-radius:18px;padding:14px;height:max-content;position:sticky;top:12px}
.progress h3{margin:0 0 12px;font-size:18px}
.rounds{display:grid;gap:6px}
.round{padding:7px 9px;border-radius:9px;font-size:12px;font-weight:850;background:#f7fafb}
.round.current{background:var(--yellow);border:2px solid var(--ink);padding:5px 7px}
.round.done{background:#dcefd8}
.card{background:#fff;border:2px solid var(--ink);border-radius:20px;padding:24px}
.badge{display:inline-block;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:6px 12px;font-size:12px;font-weight:950}
h2{font-size:32px;margin:12px 0 10px;line-height:1.05}
.scenario{font-size:17px;line-height:1.55;margin:0 0 16px}
.mission,.tip,.ceo{border:2px solid var(--ink);border-radius:14px;padding:13px 15px;margin:12px 0;line-height:1.45}
.mission{background:var(--lav)}.tip{background:var(--green)}.ceo{background:#fff5cf}
.choices{display:grid;gap:12px;margin-top:18px}
.choice{width:100%;text-align:left;border:3px solid var(--ink);border-radius:16px;padding:15px 17px;cursor:pointer;transition:.12s;background:#f7fbfd}
.choice:nth-child(2){background:#fff8df}.choice:nth-child(3){background:#f7e9ed}.choice:nth-child(4){background:#eee8f7}
.choice:hover{transform:translateY(-2px);box-shadow:0 5px 0 rgba(24,48,74,.12)}
.choice.selected{box-shadow:0 0 0 4px var(--yellow);transform:translateY(-2px)}
.letter{display:inline-grid;place-items:center;width:30px;height:30px;border:2px solid var(--ink);border-radius:50%;background:#fff;font-weight:950;margin-right:9px}
.choice-title{font-weight:950;font-size:17px}
.choice-text{font-size:14px;line-height:1.45;margin:9px 0 0 39px}
.feedback{margin-top:14px;background:#f1f5f7;border:2px dashed var(--ink);border-radius:13px;padding:12px;line-height:1.45}
.hidden{display:none}
.next,.restart{margin-top:16px;width:100%;border:3px solid var(--ink);border-radius:14px;padding:14px;background:var(--ink);color:#fff;font-weight:950;cursor:pointer}
.next:disabled{opacity:.4;cursor:not-allowed}
.final{text-align:center}
.big{font-size:64px}
.report{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
.report>div{background:#f4f7f9;border:2px solid var(--ink);border-radius:13px;padding:12px}
.report .value{font-size:22px;font-weight:950;display:inline-block;margin-top:4px}
.reflection{text-align:left;background:#fff5cf;border:2px solid var(--ink);border-radius:15px;padding:15px;margin-top:16px}
textarea{width:100%;min-height:130px;margin-top:10px;border:2px solid var(--ink);border-radius:10px;padding:10px;background:#fff}
@media(max-width:760px){
  .header-row{align-items:flex-start}.speech{display:none}.goose{width:62px;min-width:62px}.goose svg{width:62px}
  .layout{grid-template-columns:1fr}.progress{position:static}.rounds{grid-template-columns:repeat(7,1fr)}
  .round{text-align:center;font-size:10px}.report{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="game">
<header>
  <div class="header-row">
    <div class="goose" aria-label="Goosetavo">
      <svg viewBox="0 0 90 110" aria-hidden="true">
        <path d="M43 38C25 29 17 17 25 9c6-6 18-2 22 8 4 10 1 20 8 30 10 14 13 31 3 45-10 13-36 12-42-4-6-15 2-31 15-37 7-3 12-7 12-13Z" fill="#fff" stroke="#18304a" stroke-width="3"/>
        <path d="M26 17C15 14 7 18 6 24c-1 6 10 8 21 3Z" fill="#f3a735" stroke="#18304a" stroke-width="3"/>
        <circle cx="31" cy="18" r="3.2" fill="#18304a"/>
        <path d="M22 36q9-5 17 1" fill="none" stroke="#18304a" stroke-width="3" stroke-linecap="round"/>
        <path d="M31 51v17M31 68l-8 10M31 68l8 10" fill="none" stroke="#18304a" stroke-width="3" stroke-linecap="round"/>
        <path d="M19 92q12 6 26-1" fill="none" stroke="#18304a" stroke-width="3" stroke-linecap="round"/>
        <path d="M27 74h8l-4 9Z" fill="#111"/>
      </svg>
    </div>
    <div>
      <h1>Goosetavo's Gourmet Goods</h1>
      <div class="subtitle">CAN YOUR BUSINESS SURVIVE?</div>
    </div>
    <div class="speech">“I trust your decisions!<br>(Probably.)”</div>
  </div>
</header>

<div class="stats">
  <div class="stat"><div class="stat-label">💰 Savings</div><div class="stat-value" id="savings">$10,000</div></div>
  <div class="stat"><div class="stat-label">📈 Total Profit</div><div class="stat-value" id="profit">$0</div></div>
  <div class="stat"><div class="stat-label">📄 Loan Balance</div><div class="stat-value" id="loan">$0</div></div>
</div>

<div class="layout">
  <aside class="progress">
    <h3>YEAR 1<br>PROGRESS</h3>
    <div class="rounds" id="rounds"></div>
  </aside>
  <main class="card" id="content"></main>
</div>
</div>

<script>
(function(){
"use strict";

const VOCAB=["afford","loan","profit","prosper","risk","savings","scarce","wages"];
const roundsEl=document.getElementById("rounds");
const contentEl=document.getElementById("content");
const savingsEl=document.getElementById("savings");
const profitEl=document.getElementById("profit");
const loanEl=document.getElementById("loan");

const R=[
["The Grand Opening",
"Goosetavo has $10,000 in <b>savings</b>. He needs a commercial oven that costs $4,000. He asks, “Can we <b>afford</b> it?” The answer depends on how much money you want available for the future.",
"Being able to <b>afford</b> something does not mean you have to buy it. <b>Savings</b> can protect a business when unexpected costs appear.",
[
["Buy the oven with savings.","The business can <b>afford</b> it and will still have $6,000 in <b>savings</b>. Buying outright avoids borrowing, but uses a large portion of money set aside for the future.",-4000,0,0],
["Find a cheaper oven.","Spending less protects more <b>savings</b>. However, a cheaper oven could be slower or less reliable, making it harder to grow.",-2500,0,0],
["Buy the $9,000 SUPER GOOSE OVEN.","Goosetavo claims it will make everything “gourmet-er.” It leaves only $1,000 in <b>savings</b>, so one surprise expense could become a major problem.",-9000,0,0]
]],
["The Furniture Fiasco",
"The shop needs tables, chairs, signs, and decorations. The full setup costs $3,500. Goosetavo says customers can “smell professionalism.” Decide how much the business can <b>afford</b> while protecting its <b>savings</b>.",
"A business can <b>afford</b> a purchase and still decide to spend less. Protecting <b>savings</b> can matter when surprises happen.",
[
["Buy everything.","The store will look polished immediately, and the business can <b>afford</b> the $3,500. The downside is that less <b>savings</b> remain for emergencies.",-3500,0,0],
["Buy only the essentials.","Spend $1,800 on tables, chairs, and basic signs. This protects more <b>savings</b>, but the store may feel less impressive at first.",-1800,0,0],
["Put the whole purchase on a loan.","Keep <b>savings</b> untouched while getting everything now, but a <b>loan</b> creates a future repayment obligation.",0,0,3500]
]],
["The Mysterious Goose Banker",
"Goosetavo discovers a donut-making machine for $5,000. He does not have enough available cash to buy it comfortably. Suddenly, a mysterious goose in a tiny suit offers a $5,000 <b>loan</b>. He says it is “probably legal.”",
"A <b>loan</b> gives a business money now but creates an obligation to repay it. Ask whether the opportunity is worth that future cost.",
[
["Take the loan and buy the machine.","The machine could create new products and future <b>profit</b> while preserving cash. The <b>loan</b> must still be repaid.",0,900,5000],
["Wait and build savings.","Avoid a <b>loan</b> entirely and save toward the machine. This protects the business from debt, but Goosetavo might miss a useful opportunity.",0,300,0],
["Spend nearly all available cash.","Avoid a <b>loan</b> and get the machine, but leave very little <b>savings</b> available for emergencies. This is financial YOLO.",-4500,700,0]
]],
["The Great Strawberry Shortage",
"Strawberry filling has become <b>scarce</b>: only 30 containers remain, and the price has doubled. Goosetavo needs 20 containers for a large order. The choice involves real <b>risk</b>.",
"<b>Scarce</b> means difficult to find or get. When something becomes <b>scarce</b>, its price or availability can change.",
[
["Buy the expensive strawberries.","Complete the order and collect payment, but the higher ingredient cost creates <b>risk</b> because the final <b>profit</b> will be smaller.",-1800,1100,0],
["Change the recipe.","Use an easier-to-find ingredient and reduce cost. This lowers <b>risk</b>, but customers may prefer the original.",-800,800,0],
["Buy all 30 containers.","Secure the <b>scarce</b> ingredient, but tying up money creates <b>risk</b> if customers stop buying strawberry products.",-2700,1300,0]
]],
["The Advertising Department",
"Business has slowed down. A marketing company offers a $1,500 campaign promising “GOOSETAVO FAME.” There is no guarantee. Goosetavo suggests standing outside yelling at pedestrians.",
"<b>Risk</b> is the chance of loss, harm, or a negative outcome. A risky decision is not automatically bad—the possible reward matters too.",
[
["Launch the full campaign.","Spend $1,500 hoping to increase future <b>profit</b>. The potential reward is large, but so is the <b>risk</b> of wasting the money.",-1500,2200,0],
["Keep the money in savings.","Avoid the advertising <b>risk</b> and keep cash available. The downside is that the business may continue struggling.",0,0,0],
["Test a smaller campaign.","Spend $500 to test the idea before committing more. This limits <b>risk</b> and provides information, but the possible <b>profit</b> increase may be smaller.",-500,900,0]
]],
["Pay the Geese",
"The business is growing and needs two employees. Their <b>wages</b> are business costs, so what you pay workers will affect <b>profit</b>.",
"<b>Wages</b> are payments received for work done. <b>Wages</b> are a business cost, which means they affect <b>profit</b>.",
[
["Pay competitive wages.","Higher <b>wages</b> can help attract and keep reliable employees. The downside is higher costs and less short-term <b>profit</b>.",-900,1400,0],
["Pay the lowest wages possible.","Lower <b>wages</b> reduce costs and may increase short-term <b>profit</b>, but employees may leave or be harder to attract.",-500,1800,0],
["Offer unlimited donuts as wages.","Goosetavo argues this is “basically money.” It saves cash, but donuts are not a substitute for actual <b>wages</b>.",-200,500,0]
]],
["The Cupcake Competition",
"A local festival wants 500 gourmet cupcakes. The order could bring in lots of money, but some ingredients are <b>scarce</b> and employees would need extra hours, increasing <b>wages</b>.",
"When several costs rise at once, compare possible <b>profit</b> with the added costs and uncertainty.",
[
["Accept the huge order.","The order could create significant <b>profit</b> and new customers, but <b>scarce</b> ingredients and higher <b>wages</b> make the final result less predictable.",-2300,3000,0],
["Accept a smaller order.","A smaller order uses fewer <b>scarce</b> ingredients and requires fewer extra <b>wages</b>. You give up some possible <b>profit</b>, but reduce pressure.",-1200,1800,0],
["Turn down the order.","This eliminates costs and uncertainty, but also gives up the opportunity to increase <b>profit</b> and gain customers.",0,0,0]
]],
["The Huge School Order",
"A school offers $4,000 for 200 gourmet snack boxes. Ingredients cost $1,500, <b>wages</b> cost $800, and packaging costs $400. What would the actual <b>profit</b> be?",
"<b>Profit</b> is the amount left after all business costs are paid. Revenue is not the same thing as <b>profit</b>.",
[
["Accept the order.","Revenue is $4,000. Costs are $1,500 + $800 in <b>wages</b> + $400 = $2,700. That leaves $1,300 in <b>profit</b>.",-2700,1300,0],
["Negotiate for a higher price.","Explain that ingredients, packaging, and <b>wages</b> are expensive. A higher price could increase <b>profit</b>, but the school might take the order elsewhere.",-2200,1900,0],
["Turn down the order.","Avoid the costs and workload, but give up the opportunity to make $1,300 in potential <b>profit</b>.",0,0,0]
]],
["The Food Truck Risk",
"Goosetavo discovers a food truck for $6,000. It could reach new customers and create additional <b>profit</b>, but there is no guarantee. Spending <b>savings</b> on an uncertain opportunity creates <b>risk</b>.",
"<b>Savings</b> provide protection. Using them for a risky investment means giving up some of that protection.",
[
["Buy the truck.","The truck could create new <b>profit</b>, but spending $6,000 of <b>savings</b> is a major <b>risk</b> if sales disappoint.",-6000,3500,0],
["Keep the money in savings.","Protect the business against emergencies and future expenses, but give up possible additional <b>profit</b>.",0,500,0],
["Rent a truck for one weekend first.","Spend $1,200 to test the idea before making a $6,000 commitment. This reduces <b>risk</b>, although the test still uses <b>savings</b>.",-1200,1500,0]
]],
["The Golden Goose Incident",
"Goosetavo has $3,000 extra and desperately wants a $2,800 giant golden goose statue. Technically, the business can <b>afford</b> it. The question is whether spending nearly all that money is smart.",
"Goosetavo can <b>afford</b> it. That does not automatically mean he should buy it. “Can we?” and “Should we?” are different questions.",
[
["Buy the statue.","The business can <b>afford</b> it, and Goosetavo claims it will attract customers. But it leaves only $200 in <b>savings</b> with no clear financial return.",-2800,300,0],
["Put the money into savings.","Build a stronger <b>savings</b> cushion for future expenses and emergencies. There is no immediate customer benefit, but the <b>savings</b> provide protection.",0,400,0],
["Buy a smaller decoration and save the rest.","Spend $500 on a smaller goose display and put $2,500 into <b>savings</b>. This balances presentation with protection.",-500,500,0]
]],
["The Terrible Month",
"Things go sideways. Ingredients are <b>scarce</b> and expensive, fewer customers are coming in, and <b>profit</b> is shrinking. Goosetavo walks in holding a calculator upside down.",
"Strong businesses respond to problems without automatically choosing the biggest or safest-looking option. Think about costs, <b>risk</b>, and how long your <b>savings</b> can protect you.",
[
["Raise prices.","Higher prices could protect <b>profit</b> while ingredients are <b>scarce</b>, but customers may buy less or choose another business.",0,1000,0],
["Substitute ingredients.","Use less expensive, easier-to-find ingredients to reduce costs and protect <b>profit</b>. Customers may dislike the recipe change.",-500,1200,0],
["Use savings temporarily.","Keep prices stable while searching for a long-term solution. This uses <b>savings</b> and creates vulnerability if the problem continues.",-1800,700,0],
["Take a huge advertising risk.","Spend $4,000 on a campaign that might attract customers and increase <b>profit</b>. There is no guarantee, so the <b>risk</b> is high.",-4000,3500,0]
]],
["The Second Store",
"A second location becomes available for $8,000. The business has $5,500 in <b>savings</b>, and the bank offers a $4,000 <b>loan</b>. Decide whether expansion is affordable without taking on too much <b>risk</b>.",
"Expansion can create future growth, but borrowing and spending <b>savings</b> both have consequences. Consider whether the business can <b>afford</b> the plan.",
[
["Expand using savings plus the loan.","Use $5,500 in <b>savings</b> and $2,500 of the <b>loan</b>. The business can <b>afford</b> the location, but it takes on new costs and repayment <b>risk</b>.",-5500,3000,2500],
["Wait and build savings.","Avoid a new <b>loan</b> and keep more financial protection. Another business might take the location first.",0,900,0],
["Do not expand.","Avoid added <b>risk</b> and debt completely. The business keeps its <b>savings</b> but gives up a possible future <b>profit</b> opportunity.",0,500,0],
["Find a smaller location.","Choose a location that is easier to <b>afford</b>, requiring less borrowing and less <b>risk</b>. The tradeoff is potentially fewer customers.",-3000,1800,1000]
]],
["Will Goosetavo Prosper?",
"One year has passed. The business survived shortages, employee <b>wages</b>, <b>loans</b>, slow months, risky opportunities, and questionable goose purchases. What should it do next if it wants to <b>prosper</b>?",
"To <b>prosper</b> means to do well and become successful. A business does not <b>prosper</b> just because it makes money once—it needs a sustainable plan.",
[
["Protect savings.","Build a larger <b>savings</b> cushion before making major investments. This provides stability, although growth may be slower.",0,1000,0],
["Invest in growth.","Use some available money to improve products, equipment, or marketing. This could increase future <b>profit</b>, but spending now creates uncertainty.",-2500,2800,0],
["Take a major risk.","Make a large investment that could dramatically increase <b>profit</b>. The possible reward is high, but the <b>risk</b> could damage <b>savings</b>.",-4500,5000,0]
]],
["The Goosetavo Annual Report",
"Year 1 is complete. Goosetavo has to report what happened to the business: how much money is left, how much <b>profit</b> was made, what <b>loan</b> remains, and which decisions involved <b>risk</b>.",
"Your final report should connect vocabulary to the decisions you made. Remember: <b>profit</b> is what remains after costs, <b>savings</b> are money set aside for the future, and to <b>prosper</b> means to do well and become successful.",
[
["Write a strong annual report.","Choose one major decision and explain why you made it and what happened because of it. Use at least two vocabulary words in your explanation.",0,0,0],
["Blame the goose.","Explain that Goosetavo made every decision and you were merely the consultant. Creative, but it does not demonstrate what you learned.",0,0,0],
["Declare victory immediately.","Announce that the business is successful without checking the evidence. Fast, but not very CEO-like.",0,0,0]
]]
];

let state={round:0,savings:10000,profit:0,loan:0,risks:0,employees:0,chosen:null};

function money(n){return "$"+Math.round(n).toLocaleString();}
function drawRounds(){
  roundsEl.innerHTML=R.map((r,i)=>{
    const cls=i===state.round?"round current":(i<state.round?"round done":"round");
    return '<div class="'+cls+'">'+(i<state.round?"✓ ":"")+"Round "+(i+1)+"</div>";
  }).join("");
}
function updateStats(){
  savingsEl.textContent=money(Math.max(0,state.savings));
  profitEl.textContent=money(state.profit);
  loanEl.textContent=money(state.loan);
  drawRounds();
}
function vocab(text){
  let s=text;
  VOCAB.forEach(word=>{
    const re=new RegExp("\\b"+word+"\\b","gi");
    s=s.replace(re,m=>"<strong><u>"+m+"</u></strong>");
  });
  return s;
}
function render(){
  updateStats();
  if(state.round>=R.length){renderFinal();return;}
  const r=R[state.round];
  state.chosen=null;
  contentEl.innerHTML=
    '<div class="badge">ROUND '+(state.round+1)+' OF 14</div>'+
    '<h2>'+r[0]+'</h2>'+
    '<p class="scenario">'+vocab(r[1])+'</p>'+
    '<div class="mission"><strong>🪿 CEO RULE: READ. DISCUSS. DECIDE.</strong><br>Read every option. Discuss the benefit AND the downside. Be ready to explain why.</div>'+
    '<div class="ceo">🧠 <strong>CEO CHECK:</strong> Every choice has a tradeoff. Do not rush.</div>'+
    '<div class="choices">'+r[3].map((x,j)=>
      '<button type="button" class="choice" data-choice="'+j+'">'+
      '<span class="letter">'+String.fromCharCode(65+j)+'</span>'+
      '<span class="choice-title">'+vocab(x[0])+'</span>'+
      '<div class="choice-text">'+vocab(x[1])+'</div>'+
      '</button>'
    ).join("")+'</div>'+
    '<div class="tip">💡 <strong>GOOSETAVO’S BUSINESS TIP:</strong><br>'+vocab(r[2])+'</div>'+
    '<div id="feedback" class="feedback hidden"></div>'+
    '<button type="button" class="next" id="next" disabled>LOCK IN MY DECISION →</button>';

  const choiceButtons=Array.from(contentEl.querySelectorAll(".choice"));
  const feedbackEl=document.getElementById("feedback");
  const nextEl=document.getElementById("next");

  choiceButtons.forEach(btn=>{
    btn.addEventListener("click",()=>{
      choiceButtons.forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      state.chosen=Number(btn.dataset.choice);
      feedbackEl.classList.remove("hidden");
      feedbackEl.innerHTML="<strong>🪿 GOOSETAVO SAYS…</strong><br>“Hmmm. Interesting choice. My accountant is blinking slowly. Make sure you can explain the tradeoff!”";
      nextEl.disabled=false;
    });
  });

  nextEl.addEventListener("click",()=>{
    if(state.chosen===null)return;
    const x=r[3][state.chosen];
    state.savings=Math.max(0,state.savings+x[2]);
    state.profit+=x[3];
    state.loan=Math.max(0,state.loan+x[4]);
    if(x[4]>0)state.risks++;
    if(state.round===5)state.employees=2;
    state.round++;
    window.scrollTo({top:0,behavior:"smooth"});
    render();
  });
}
function renderFinal(){
  let title,sub,emoji;
  if(state.profit>=12000 && state.savings>=5000 && state.loan<=3000){
    title="GOOSETAVO IS PROSPERING!";
    sub="The business made it through a whole year of ridiculous decisions—and the numbers are looking strong.";
    emoji="🪿🏆";
  }else if(state.savings>=2500 && state.profit>=5000){
    title="THE BUSINESS SURVIVED!";
    sub="There were some questionable choices, but Goosetavo’s Gourmet Goods made it through Year 1.";
    emoji="🪿🎉";
  }else{
    title="THE ACCOUNTANT HAS REQUESTED A MEETING.";
    sub="Goosetavo would like to remind you that “financial YOLO” is not an official accounting strategy.";
    emoji="🪿😬";
  }
  contentEl.innerHTML=
    '<div class="final">'+
    '<div class="big">'+emoji+'</div>'+
    '<div class="badge">YEAR 1 COMPLETE</div>'+
    '<h2>'+title+'</h2>'+
    '<p class="scenario">'+sub+'</p>'+
    '<div class="report">'+
      '<div><strong>💰 Final Savings</strong><br><span class="value">'+money(state.savings)+'</span></div>'+
      '<div><strong>📈 Total Profit</strong><br><span class="value">'+money(state.profit)+'</span></div>'+
      '<div><strong>📄 Loan Balance</strong><br><span class="value">'+money(state.loan)+'</span></div>'+
      '<div><strong>⚠️ Major Risks</strong><br><span class="value">'+state.risks+'</span></div>'+
      '<div><strong>👷 Employees</strong><br><span class="value">'+state.employees+'</span></div>'+
      '<div><strong>🪿 Goose Status</strong><br><span class="value">Still derpy.</span></div>'+
    '</div>'+
    '<div class="reflection"><strong>✍️ CEO FINAL REFLECTION</strong>'+
      '<p>Choose one decision that had a major impact on the business. Explain why you made that choice and what happened because of it. Use <strong>at least TWO</strong> vocabulary words: <strong><u>afford</u></strong>, <strong><u>loan</u></strong>, <strong><u>profit</u></strong>, <strong><u>prosper</u></strong>, <strong><u>risk</u></strong>, <strong><u>savings</u></strong>, <strong><u>scarce</u></strong>, <strong><u>wages</u></strong>.</p>'+
      '<textarea placeholder="As CEO, I chose..."></textarea>'+
    '</div>'+
    '<button type="button" class="restart" id="restart">START A NEW BUSINESS 🔄</button>'+
    '</div>';
  document.getElementById("restart").addEventListener("click",()=>{
    state={round:0,savings:10000,profit:0,loan:0,risks:0,employees:0,chosen:null};
    render();
  });
}
render();
})();
</script>
</body>
</html>
