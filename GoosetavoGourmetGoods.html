<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Goosetavo's Gourmet Goods</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eaf5f7;color:#18304a;font-family:Arial,Helvetica,sans-serif}
.game{max-width:1050px;margin:20px auto;background:#fffaf0;border:3px solid #18304a;border-radius:24px;overflow:hidden}
.top{background:#dff1f7;padding:20px;text-align:center;border-bottom:3px solid #18304a}
.brand{display:flex;align-items:center;justify-content:center;gap:18px}.goose{font-size:72px;transform:rotate(-5deg)}
h1{font-size:clamp(30px,5vw,52px);margin:0;font-weight:900}.subtitle{display:inline-block;background:#f7cf4b;border:2px solid #18304a;border-radius:999px;padding:6px 15px;font-weight:900;margin-top:6px}
.speech{background:#fff;border:2px solid #18304a;border-radius:18px;padding:10px;font-weight:800;max-width:190px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:15px;background:#fff}
.stat{border:2px solid #18304a;border-radius:15px;padding:11px;background:#f4f7d9}.stat:nth-child(2){background:#e6f5df}.stat:nth-child(3){background:#e1edf8}
.label{font-size:12px;text-transform:uppercase;font-weight:900}.value{font-size:27px;font-weight:950;margin-top:3px}
.layout{display:grid;grid-template-columns:145px 1fr;gap:18px;padding:18px}.progress{background:#e9f1f5;border:2px solid #18304a;border-radius:17px;padding:14px;height:max-content}.progress h3{margin:0 0 12px;font-size:15px}
.rounds{display:grid;gap:5px}.round{font-size:11px;font-weight:800;padding:7px;border-radius:9px;color:#547080}.round.current{background:#f7cf4b;color:#18304a}.round.done{background:#d8ebdc;color:#18304a}
.badge{display:inline-block;background:#f7cf4b;border:2px solid #18304a;border-radius:10px;padding:6px 10px;font-weight:950;font-size:12px}
h2{font-size:clamp(28px,4vw,42px);margin:9px 0;line-height:1.05}.scenario{font-size:16px;line-height:1.55}
.mission,.ceo,.tip,.feedback{border-radius:14px;padding:11px 14px;margin:12px 0;line-height:1.45}.mission{background:#fff;border:2px dashed #8c6b19}.ceo{background:#d9eef7;border:2px solid #18304a;font-weight:850}.tip{background:#edf5d8;border:2px solid #18304a}.feedback{background:#fff;border:2px solid #18304a}
.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;border:2px solid #18304a;border-radius:15px;padding:14px 16px;cursor:pointer;color:#18304a}.choice.a{background:#e2f1fa}.choice.b{background:#fff0c9}.choice.c{background:#fbe0ea}.choice.d{background:#e6f2dd}
.choice:hover{transform:translateY(-2px)}.choice.selected{box-shadow:5px 5px 0 #18304a}.letter{display:inline-grid;place-items:center;width:35px;height:35px;border-radius:50%;background:#18304a;color:white;font-weight:950;margin-right:9px}.choice-title{font-weight:950;font-size:16px}.choice-text{font-size:13.5px;line-height:1.45;margin:7px 0 0 44px}
.next,.restart{width:100%;border:2px solid #18304a;border-radius:14px;padding:13px;background:#72c995;color:#18304a;font-weight:950;font-size:16px;cursor:pointer;margin-top:3px}.next:disabled{opacity:.45;cursor:not-allowed}
.hidden{display:none}.report{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:15px 0}.report div{background:#fff;border:2px solid #18304a;border-radius:13px;padding:11px}.final{text-align:center;padding:10px}.big{font-size:90px}.reflection{background:#fff;border:2px dashed #8c6b19;border-radius:15px;padding:15px;text-align:left;margin-top:15px}.reflection textarea{width:100%;min-height:120px;border:2px solid #18304a;border-radius:10px;padding:10px;font:inherit;margin-top:8px}.restart{width:auto;background:#f7cf4b}
@media(max-width:700px){.layout{grid-template-columns:1fr}.progress{display:none}.stats{grid-template-columns:1fr}.brand .speech{display:none}.choice-text{margin-left:0}.report{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="game" id="game">
<div class="top"><div class="brand"><div class="goose">🪿</div><div><h1>Goosetavo's Gourmet Goods</h1><div class="subtitle">CAN YOUR BUSINESS SURVIVE?</div></div><div class="speech">“I trust your decisions!<br>(Probably.)”</div></div></div>
<div class="stats"><div class="stat"><div class="label">💰 Savings</div><div class="value" id="savings">$10,000</div></div><div class="stat"><div class="label">📈 Total Profit</div><div class="value" id="profit">$0</div></div><div class="stat"><div class="label">📄 Loan Balance</div><div class="value" id="loan">$0</div></div></div>
<div class="layout"><aside class="progress"><h3>YEAR 1<br>PROGRESS</h3><div class="rounds" id="rounds"></div></aside><main id="content"></main></div>
</div>
<script>
const V=["afford","loan","profit","prosper","risk","savings","scarce","wages"];
const R=[
["The Grand Opening","Goosetavo has $10,000 in savings. He needs a commercial oven that costs $4,000. He asks, “Can we afford it?” You realize the answer depends on how much money you want available for the future.","Savings is money set aside for the future. Being able to afford something does not mean you have to buy it.",
[["Buy the oven with savings.","The business can afford it and will still have $6,000 in savings. Buying outright avoids borrowing, but it uses a large portion of money set aside for the future.",-4000,0,0],["Find a cheaper oven.","Spending less protects more savings for future expenses. However, a cheaper oven could be slower or less reliable, which might make it harder to grow.",-2500,0,0],["Buy the $9,000 SUPER GOOSE OVEN.","Goosetavo claims it will make the business “gourmet-er.” It leaves only $1,000 in savings, so one unexpected expense could become a major problem.",-9000,0,0]]],
["The Furniture Fiasco","The shop needs tables, chairs, signs, and decorations. The full setup costs $3,500. Goosetavo says customers can “smell professionalism.” Decide how much the business can afford while protecting its savings.","A business can afford a purchase and still decide to spend less. Protecting savings can matter when surprises happen.",
[["Buy everything.","The store will look polished immediately, and the business can afford the $3,500. The downside is that less savings remain for emergencies.",-3500,0,0],["Buy only the essentials.","Spend $1,800 on tables, chairs, and basic signs. This protects more savings, but the store may feel less impressive at first.",-1800,0,0],["Put the whole purchase on a loan.","Keep savings untouched while getting everything now, but taking on a loan creates a future repayment obligation.",0,0,3500]]],
["The Mysterious Goose Banker","Goosetavo discovers a donut-making machine for $5,000. He does not have enough available cash to buy it comfortably. Suddenly, a mysterious goose in a tiny suit offers a $5,000 loan. He says it is “probably legal.”","A loan gives a business money now but creates an obligation to repay it. Ask whether the opportunity is worth that future cost.",
[["Take the loan and buy the machine.","The machine could create new products and future profit while preserving cash. The loan must still be repaid.",0,900,5000],["Wait and build savings.","Avoid a loan entirely and save toward the machine. This protects the business from debt, but Goosetavo might miss a useful opportunity.",0,300,0],["Spend nearly all available cash.","Avoid a loan and get the machine, but leave very little savings available for emergencies. This is financial YOLO.",-4500,700,0]]],
["The Great Strawberry Shortage","Strawberry filling has become scarce: only 30 containers remain, and the price has doubled. Goosetavo needs 20 containers for a large order. The choice involves real risk.","Scarce means difficult to find or get. When something becomes scarce, its price or availability can change.",
[["Buy the expensive strawberries.","Complete the order and collect payment, but the higher ingredient cost creates risk because the final profit will be smaller.",-1800,1100,0],["Change the recipe.","Use an easier-to-find ingredient and reduce cost. This lowers risk, but customers may prefer the original.",-800,800,0],["Buy all 30 containers.","Secure the scarce ingredient, but tying up money creates risk if customers stop buying strawberry products.",-2700,1300,0]]],
["The Advertising Department","Business has slowed down. A marketing company offers a $1,500 campaign promising “GOOSETAVO FAME.” There is no guarantee. Goosetavo suggests standing outside yelling at pedestrians.","Risk is the chance of loss, harm, or a negative outcome. A risky decision is not automatically bad—the possible reward matters too.",
[["Launch the full campaign.","Spend $1,500 hoping to increase future profit. The potential reward is large, but so is the risk of wasting the money.",-1500,2200,0],["Keep the money in savings.","Avoid the advertising risk and keep cash available. The downside is that the business may continue struggling.",0,0,0],["Test a smaller campaign.","Spend $500 to test the idea before committing more. This limits risk and provides information, but the possible profit increase may be smaller.",-500,900,0]]],
["Pay the Geese","The business is growing and needs two employees. Their wages are business costs, so what you pay workers will affect profit.","Wages are payments received for work done. Wages are a business cost, which means they affect profit.",
[["Pay competitive wages.","Higher wages can help attract and keep reliable employees. The downside is higher costs and less short-term profit.",-900,1400,0],["Pay the lowest wages possible.","Lower wages reduce costs and may increase short-term profit, but employees may leave or be harder to attract.",-500,1800,0],["Offer unlimited donuts as wages.","Goosetavo argues this is “basically money.” It saves cash, but donuts are not a substitute for actual wages.",-200,500,0]]],
["The Cupcake Competition","A local festival wants 500 gourmet cupcakes. The order could bring in lots of money, but some ingredients are scarce and employees would need extra hours, increasing wages.","When several costs rise at once, compare possible profit with the added costs and uncertainty.",
[["Accept the huge order.","The order could create significant profit and new customers, but scarce ingredients and higher wages make the final result less predictable.",-2300,3000,0],["Accept a smaller order.","A smaller order uses fewer scarce ingredients and requires fewer extra wages. You give up some possible profit, but reduce pressure.",-1200,1800,0],["Turn down the order.","This eliminates costs and uncertainty, but also gives up the opportunity to increase profit and gain customers.",0,0,0]]],
["The Huge School Order","A school offers $4,000 for 200 gourmet snack boxes. Ingredients cost $1,500, wages cost $800, and packaging costs $400. What would the actual profit be?","Profit is the amount left after all business costs are paid. Revenue is not the same thing as profit.",
[["Accept the order.","Revenue is $4,000. Costs are $1,500 + $800 in wages + $400 = $2,700. That leaves $1,300 in profit.",-2700,1300,0],["Negotiate for a higher price.","Explain that ingredients, packaging, and wages are expensive. A higher price could increase profit, but the school might take the order elsewhere.",-2200,1900,0],["Turn down the order.","Avoid the costs and workload, but give up the opportunity to make $1,300 in potential profit.",0,0,0]]],
["The Food Truck Risk","Goosetavo discovers a food truck for $6,000. It could reach new customers and create additional profit, but there is no guarantee. Spending savings on an uncertain opportunity creates risk.","Savings provide protection. Using them for a risky investment means giving up some of that protection.",
[["Buy the truck.","The truck could create new profit, but spending $6,000 of savings is a major risk if sales disappoint.",-6000,3500,0],["Keep the money in savings.","Protect the business against emergencies and future expenses, but give up possible additional profit.",0,500,0],["Rent a truck for one weekend first.","Spend $1,200 to test the idea before making a $6,000 commitment. This reduces risk, although the test still uses savings.",-1200,1500,0]]],
["The Golden Goose Incident","Goosetavo has $3,000 extra and desperately wants a $2,800 giant golden goose statue. Technically, the business can afford it. The question is whether spending nearly all that money is smart.","Goosetavo can afford it. That does not automatically mean he should buy it. “Can we?” and “Should we?” are different questions.",
[["Buy the statue.","The business can afford it, and Goosetavo claims it will attract customers. But it leaves only $200 in savings with no clear financial return.",-2800,300,0],["Put the money into savings.","Build a stronger financial cushion for future expenses and emergencies. There is no immediate customer benefit, but the savings provide protection.",0,400,0],["Buy a smaller decoration and save the rest.","Spend $500 on a smaller goose display and put $2,500 into savings. This balances presentation with protection.",-500,500,0]]],
["The Terrible Month","Things go sideways. Ingredients are scarce and expensive, fewer customers are coming in, and profit is shrinking. Goosetavo walks in holding a calculator upside down.","Strong businesses respond to problems without automatically choosing the biggest or safest-looking option. Think about costs, risk, and how long your savings can protect you.",
[["Raise prices.","Higher prices could protect profit while ingredients are scarce, but customers may buy less or choose another business.",0,1000,0],["Substitute ingredients.","Use less expensive, easier-to-find ingredients to reduce costs and protect profit. Customers may dislike the recipe change.",-500,1200,0],["Use savings temporarily.","Keep prices stable while searching for a long-term solution. This uses savings and creates vulnerability if the problem continues.",-1800,700,0],["Take a huge advertising risk.","Spend $4,000 on a campaign that might attract customers and increase profit. There is no guarantee.",-4000,3500,0]]],
["The Second Store","A second location becomes available for $8,000. The business has $5,500 in savings, and the bank offers a $4,000 loan. Decide whether expansion is affordable without taking on too much risk.","Expansion can create future growth, but borrowing and spending savings both have consequences.",
[["Expand using savings plus the loan.","Use $5,500 in savings and $2,500 of the loan. The business can afford the location, but it takes on new costs and repayment risk.",-5500,3000,2500],["Wait and build savings.","Avoid a new loan and keep more financial protection. Another business might take the location first.",0,900,0],["Do not expand.","Avoid added risk and debt completely. The business keeps its savings but gives up a possible future profit opportunity.",0,500,0],["Find a smaller location.","Choose a location that is easier to afford, requiring less borrowing and less risk. The tradeoff is potentially fewer customers.",-3000,1800,1000]]],
["Will Goosetavo Prosper?","One year has passed. The business survived shortages, employee wages, loans, slow months, risky opportunities, and questionable goose purchases. What should it do next if it wants to prosper?","To prosper means to do well and become successful. A business does not prosper just because it makes money once—it needs a sustainable plan.",
[["Protect savings.","Build a larger savings cushion before making major investments. This provides stability, although growth may be slower.",0,1000,0],["Invest in growth.","Use some available money to improve products, equipment, or marketing. This could increase future profit, but spending now creates uncertainty.",-2500,2800,0],["Take a major risk.","Make a large investment that could dramatically increase profit. The possible reward is high, but losses could damage savings.",-4500,5000,0]]]
];
let state={i:0,s:10000,p:0,l:0,r:0,employees:0};
function money(n){return "$"+Math.round(n).toLocaleString()}
function mark(text){let out=text;V.forEach(w=>out=out.replace(new RegExp("\\b"+w+"\\b","gi"),m=>"<b><u>"+m+"</u></b>"));return out}
function drawRounds(){rounds.innerHTML=R.map((_,i)=>`<div class="round ${i===state.i?"current":""} ${i<state.i?"done":""}">${i<state.i?"✓ ":""}Round ${i+1}</div>`).join("")}
function stats(){savings.textContent=money(Math.max(0,state.s));profit.textContent=money(state.p);loan.textContent=money(state.l);drawRounds()}
function render(){
stats();
if(state.i===R.length){final();return}
const r=R[state.i];
content.innerHTML=`<div class="badge">ROUND ${state.i+1} OF 14</div><h2>${r[0]}</h2><p class="scenario">${mark(r[1])}</p>
<div class="mission"><b>🪿 CEO RULE: READ. DISCUSS. DECIDE.</b><br>Read every option. Discuss the benefit AND the downside. Be ready to explain why.</div>
<div class="ceo">🧠 <b>CEO CHECK:</b> Every choice has a tradeoff. Don't rush!</div>
<div class="choices">${r[3].map((x,j)=>`<button class="choice ${["a","b","c","d"][j]}" data-j="${j}"><span class="letter">${String.fromCharCode(65+j)}</span><span class="choice-title">${mark(x[0])}</span><div class="choice-text">${mark(x[1])}</div></button>`).join("")}</div>
<div class="tip">💡 <b>GOOSETAVO'S BUSINESS TIP:</b><br>${mark(r[2])}</div>
<div id="feedback" class="feedback hidden"></div><button class="next" id="next" disabled>LOCK IN MY DECISION →</button>`;
let chosen=null;
document.querySelectorAll(".choice").forEach(b=>b.onclick=()=>{document.querySelectorAll(".choice").forEach(x=>x.classList.remove("selected"));b.classList.add("selected");chosen=+b.dataset.j;feedback.classList.remove("hidden");feedback.innerHTML="<b>🪿 GOOSETAVO SAYS…</b><br>“Hmmm. Interesting choice. My accountant is blinking slowly. Make sure you can explain the tradeoff!”;next.disabled=false});
next.onclick=()=>{if(chosen===null)return;let x=r[3][chosen];state.s=Math.max(0,state.s+x[2]);state.p+=x[3];state.l=Math.max(0,state.l+x[4]);if(x[4]>0)state.r++;if(state.i===5)state.employees=2;state.i++;render();window.scrollTo({top:0,behavior:"smooth"})};
}
function final(){
let h,sub,emoji;
if(state.p>=12000&&state.s>=5000&&state.l<=3000){h="GOOSETAVO IS PROSPERING!";sub="The business made it through a whole year of ridiculous decisions—and the numbers are looking strong.";emoji="🪿🏆"}
else if(state.s>=2500&&state.p>=5000){h="THE BUSINESS SURVIVED!";sub="There were some questionable choices, but Goosetavo's Gourmet Goods made it through Year 1.";emoji="🪿🎉"}
else{h="THE ACCOUNTANT HAS REQUESTED A MEETING.";sub="Goosetavo would like to remind you that “financial YOLO” is not an official accounting strategy.";emoji="🪿😬"}
content.innerHTML=`<div class="final"><div class="big">${emoji}</div><div class="badge">YEAR 1 COMPLETE</div><h2>${h}</h2><p>${sub}</p>
<div class="report"><div><b>💰 Final Savings</b><br><span class="value">${money(state.s)}</span></div><div><b>📈 Total Profit</b><br><span class="value">${money(state.p)}</span></div><div><b>📄 Loan Balance</b><br><span class="value">${money(state.l)}</span></div><div><b>⚠️ Major Risks</b><br><span class="value">${state.r}</span></div><div><b>👷 Employees</b><br><span class="value">${state.employees}</span></div><div><b>🪿 Goose Status</b><br><span class="value">Still derpy.</span></div></div>
<div class="reflection"><b>✍️ CEO FINAL REFLECTION</b><p>Choose one decision that had a major impact on the business. Explain why you made that choice and what happened because of it. Use <b>at least TWO</b> vocabulary words: afford, loan, profit, prosper, risk, savings, scarce, wages.</p><textarea placeholder="As CEO, I chose..."></textarea></div>
<button class="restart" onclick="location.reload()">START A NEW BUSINESS 🔄</button></div>`;
}
render();
</script>
</body>
</html>
